name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Отменяем устаревшие прогоны на той же ветке/PR: экономит минуты и не даёт
# «зелёному» старому прогону перезаписать актуальный статус.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Детерминированные значения только для сборки/тестов в CI.
  # Не production-секреты; реальные ключи задаются в окружении деплоя.
  AUTH_SECRET: ci-auth-secret-not-for-production-0001
  ENCRYPTION_KEY: "BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=" # base64 32 байта (0x07), только для CI
  APP_URL: http://127.0.0.1:3100
  DATABASE_DRIVER: pglite
  PGLITE_DATA_DIR: .data/ci
  AUTO_MIGRATE: "true"
  AUTH_DEV_SHOW_LINK: "true"
  EMAIL_TRANSPORT: console
  LLM_PROVIDER: fake

jobs:
  verify:
    name: Lint / types / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright webServer сам делает production-сборку (pnpm build в test:e2e),
      # но собираем отдельно, чтобы падение сборки было видно до установки браузера.
      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm exec playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
